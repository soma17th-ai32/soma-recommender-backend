version = 1
revision = 2
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version >= '3.14'",
    "python_full_version == '3.13.*'",
    "python_full_version < '3.13'",
]

[manifest]
members = [
    "soma-agent",
    "soma-api",
    "soma-recommender-backend",
    "soma-shared",
]

[[package]]
name = "soma-agent"
version = "0.1.0"
source = { virtual = "packages/agent" }

[[package]]
name = "soma-api"
version = "0.1.0"
source = { virtual = "apps/api" }

[[package]]
name = "soma-recommender-backend"
version = "0.1.0"
source = { virtual = "." }

[package.dev-dependencies]
dev = [
    { name = "pyright" },
    { name = "ruff" },
]

[package.metadata]

[package.metadata.requires-dev]
dev = [
    { name = "pyright", specifier = ">=1.1.409" },
    { name = "ruff", specifier = ">=0.15.12" },
]

[[package]]
name = "soma-shared"
version = "0.1.0"
source = { virtual = "packages/shared" }
