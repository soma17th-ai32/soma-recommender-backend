[project]
name = "soma-recommender-backend"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/agent",
    "packages/shared"
]
